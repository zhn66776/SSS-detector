<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSS Test Inference Map</title>
<link rel="stylesheet" href="/static/map.css">
</head>
<body>
<header>
  <h1>SSS Contact Inference Map <span class="sub" id="src-sub"></span></h1>
  <div class="controls">
    <label>Data <select id="src"></select></label>
    <button id="btn-src-file" type="button" title="Select one sonar image for automatic tiling, or hold Command/Ctrl to select multiple 150×150 patches">📂 Choose images or patches…</button>
    <input id="src-file" type="file" accept=".tif,.tiff,.png" multiple hidden>
    <button id="btn-dir-file" type="button" title="Select a folder of 150×150 patches, such as data/images/test in the dataset bundle">📁 Choose patch folder…</button>
    <input id="dir-file" type="file" webkitdirectory multiple hidden>
    <span id="src-info" class="info"></span>
  </div>
  <div class="controls">
    <label>Model <select id="model"></select></label>
    <button id="btn-model-file" type="button">📂 Choose model weights…</button>
    <input id="model-file" type="file" accept=".pt" hidden>
    <span id="model-info" class="info"></span>
  </div>
  <div class="controls">
    <button id="btn-start" type="button">▶ Start inference</button>
    <button id="btn-clear" type="button" class="danger">🗑 Delete inference results</button>
    <label>Confidence threshold <input id="conf" type="number" min="0.05" max="1" step="0.05" value="0.50"></label>
    <label class="buffer-only"><input id="buffer" type="checkbox"> Include buffer (151 patches in chunk 10)</label>
    <span id="status" class="status">Ready</span>
  </div>
  <div class="progress"><div id="bar"></div></div>
  <div class="counts" id="counts"></div>
</header>
<main>
  <section id="mapwrap">
    <div class="maptools">
      <span class="legend"><i class="sw pending"></i>Not processed <i class="sw done"></i>Processed: no detections <i class="sw det"></i>Processed: detections
        <span class="buffer-only"><i class="sw buf"></i>Buffer (not processed)</span>
        <span class="gt-only"><i class="sw gt"></i>Existing annotations (not reviewed)</span>
        <span class="nodata-only"><i class="sw nodata"></i>No data (skipped)</span>
        <i class="sw red"></i>Detected contact</span>
      <label class="gt-only"><input id="show-gt" type="checkbox"> Annotations</label>
      <label><input id="show-grid" type="checkbox" checked> Patch grid</label>
      <button id="btn-fit" type="button">Fit view</button>
      <span class="hint">Scroll to zoom · Drag to pan · Click a patch to inspect</span>
    </div>
    <div id="mapbox"><canvas id="map"></canvas><div id="tip" hidden></div></div>
  </section>
  <aside id="side">
    <div id="empty" class="empty">Click a patch on the map to inspect it</div>
    <div id="detail" hidden>
      <h2 id="d-title"></h2>
      <div id="d-meta" class="meta"></div>
      <div class="stage"><img id="d-img" alt="patch"><svg id="d-svg" viewBox="0 0 150 150" xmlns="http://www.w3.org/2000/svg"></svg></div>
      <div class="opts">
        <label><input id="d-low" type="checkbox"> Show predictions below the threshold</label>
        <label class="gt-only"><input id="d-gt" type="checkbox"> Show annotations</label>
      </div>
      <table id="d-table"></table>
    </div>
    <div id="outputs" hidden>
      <h3>Output files</h3>
      <div id="out-dir" class="meta"></div>
      <ul id="out-list"></ul>
    </div>
  </aside>
</main>
<script src="/static/map.js"></script>
</body>
</html>
